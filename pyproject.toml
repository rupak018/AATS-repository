[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aats"
version = "0.1.0"
description = "Project AATS - deterministic, replayable ORB/VWAP research and paper-trading system (paper-only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]
# Used in CI to cross-check the committed NYSE calendar file.
calendar = ["exchange_calendars>=4.5"]

[project.scripts]
aats-replay = "aats.replay.cli:main"

[tool.setuptools.packages.find]
include = ["aats*"]

[tool.setuptools.package-data]
aats = ["calendar/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "golden: replay output compared with approved golden files",
  "slow: long-running stress/property tests (nightly)",
  "integration: needs optional third-party packages",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "DTZ001", "PLR0917", "PLC0415", "RUF005", "E501"]
"tools/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["aats"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*", "yaml"]
ignore_missing_imports = true
